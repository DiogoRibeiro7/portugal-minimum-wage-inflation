[project]
name = "pt-minimum-wage-inflation"
version = "0.2.0"
description = "Reproducible empirical study of minimum wages, productivity and inflation in Portugal."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0.txt"]
authors = [{ name = "Diogo Ribeiro", email = "diogo_dj@hotmail.com" }]
keywords = [
    "minimum wage",
    "inflation",
    "pass-through",
    "labour productivity",
    "Portugal",
    "local projections",
    "reproducible research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.3,<3.0",
    "numpy>=2.2,<3.0",
    "requests>=2.32,<3.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.11,<3.0",
    "typer[all]>=0.27.1,<1.0",
    "openpyxl>=3.1,<4.0",
    "lxml>=6.1,<7.0",
    "beautifulsoup4>=4.13,<5.0",
    "pyarrow>=23.0.1",
    "statsmodels>=0.14,<1.0",
    "linearmodels>=6.1,<7.0",
    "scipy>=1.15,<2.0",
    "matplotlib>=3.10,<4.0",
    "pypdf (>=6.0,<7.0)",
    "cryptography>=50.0,<51.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/portugal-minimum-wage-inflation"
Repository = "https://github.com/DiogoRibeiro7/portugal-minimum-wage-inflation"
Issues = "https://github.com/DiogoRibeiro7/portugal-minimum-wage-inflation/issues"
Changelog = "https://github.com/DiogoRibeiro7/portugal-minimum-wage-inflation/blob/main/CHANGELOG.md"

[project.scripts]
ptmw = "pt_mw_inflation.cli:app"

[tool.poetry]
packages = [{ include = "pt_mw_inflation", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.2"
mypy = "^1.16"
ruff = "^0.12"
pre-commit = "^4.2"
types-requests = "^2.32"
types-PyYAML = "^6.0"
pandas-stubs = "^3.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# Typer expresses CLI metadata as call-valued defaults; B008 is a false positive here.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# statsmodels ships no type information; the wrappers around it are annotated.
# Add "linearmodels.*" here once the panel estimators import it.
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
