# Share of full-time employees paid the guaranteed minimum wage, by economic
# activity, for the country as a whole.
#
# Source: GEP/MTSSS, 10th monitoring report on the RMMG agreement (November
# 2018), Table 13, drawn from the Inquérito aos Ganhos e à Duração do Trabalho.
# Values are per cent, October 2017, the most recent column of that table.
#
# Two limitations that shape how this may be used.
#
# The survey excludes agriculture (CAE section A) and public administration
# (section O), so those activities have no measured bite. They are left absent
# rather than assumed, and the exposure builder reports how much employment
# that leaves uncovered.
#
# The bite is national. Applying it to regional employment composition is the
# maintained assumption of the shift-share measure: within-industry coverage is
# taken not to vary across regions. Accommodation and food service has by far
# the highest bite and differs across Portuguese regions in both its size and
# its wage distribution, so the assumption attenuates precisely the variation
# the design exploits.

source:
  publication: >-
    GEP/MTSSS, Retribuição Mínima Mensal Garantida, 10.º Relatório de
    Acompanhamento do Acordo, November 2018, Table 13.
  reference_period: 2017-10
  survey: Inquérito aos Ganhos e à Duração do Trabalho
  national_total: 21.6

# Keyed by CAE Rev. 3 section name rather than letter: the letters and names are
# misaligned in the published table's text layer, and mapping by letter assigns
# the accommodation bite to transport.
bite_by_activity:
  Indústrias Extrativas: 13.4
  Indústrias Transformadoras: 24.4
  Eletricidade, Gás, Vapor, Água Quente e Fria e Ar: 0.6
  Captação, Tratamento e Distribuição de Água: 16.3
  Construção: 24.4
  Comércio por Grosso e Retalho: 20.1
  Transportes e Armazenagem: 14.6
  Alojamento e Restauração: 35.9
  Atividades de Informação e Comunicação: 4.6
  Atividades Financeiras e de Seguros: 1.3
  Atividades Imobiliárias: 19.1
  Atividades de Consultadoria: 7.9
  Atividades Administrativas e dos Serviços de Apoio: 28.8
  Educação: 9.4
  Atividades de Saúde Humana e de Apoio Social: 24.8
  Atividades Artísticas, De Espetáculos, Desportivas e Recreativas: 19.7
  Outras Atividades de Serviços: 26.9

# Eurostat regional accounts publish employment at coarser groups than the
# survey reports the bite at, so each group's bite is the employment-weighted
# mean of its sections, using national employment by NACE section.
#
# The weights count *employees* (Eurostat `nama_10_a64_e`, `na_item=SAL_DC`),
# not total employment. The bite is a share of full-time employees, so weighting
# it by a population that also contains the self-employed would give a sector
# influence proportional to a headcount the bite was never measured over.
# Agriculture and construction carry far more self-employment than finance, so
# the mismatch would not wash out across sectors.
#
# Two differences between the populations remain and are not corrected. The
# survey covers full-time employees while the weights count employees at any
# hours, and the survey's reference month is October while the weights are an
# annual average. Both are approximations. Weighting on total employment instead
# moves the regional exposure spread by 0.04 percentage points and every group
# bite by less than half a point, so neither is capable of changing the
# conclusion the measure supports, which is that its spread is too small to
# identify anything.
#
# `sections` lists the NACE sections a group contains -- all of them, including
# those the survey does not cover. That completeness is the point. Listing only
# the measured sections would let a group's bite be assigned to employment the
# survey never looked at: the O-Q group contains public administration, which
# is outside the survey, and treating O-Q as though it were only education and
# health imputes a minimum-wage bite to public administration and overstates
# how much employment carries measured information.
#
# `measured` names the subset with a published bite. The builder weights the
# bite over `measured` and reports the share of the group's employment those
# sections represent, so a group that is only partly observed is visible as
# such rather than silently renormalised.

nace_aggregates:
  A:
    sections: [A]
    measured: []
  B-E:
    sections: [B, C, D, E]
    measured:
      - Indústrias Extrativas
      - Indústrias Transformadoras
      - Eletricidade, Gás, Vapor, Água Quente e Fria e Ar
      - Captação, Tratamento e Distribuição de Água
  F:
    sections: [F]
    measured: [Construção]
  G-I:
    sections: [G, H, I]
    measured:
      - Comércio por Grosso e Retalho
      - Transportes e Armazenagem
      - Alojamento e Restauração
  J:
    sections: [J]
    measured: [Atividades de Informação e Comunicação]
  K:
    sections: [K]
    measured: [Atividades Financeiras e de Seguros]
  L:
    sections: [L]
    measured: [Atividades Imobiliárias]
  M_N:
    sections: [M, N]
    measured:
      - Atividades de Consultadoria
      - Atividades Administrativas e dos Serviços de Apoio
  O-Q:
    sections: [O, P, Q]
    measured:
      - Educação
      - Atividades de Saúde Humana e de Apoio Social
  R-U:
    sections: [R, S, T, U]
    measured:
      - Atividades Artísticas, De Espetáculos, Desportivas e Recreativas
      - Outras Atividades de Serviços

# The NACE section each measured activity corresponds to, so the bite can be
# weighted by that section's employment. Mapped by name because the published
# table's letters and names are misaligned in its text layer.
section_of_activity:
  Indústrias Extrativas: B
  Indústrias Transformadoras: C
  Eletricidade, Gás, Vapor, Água Quente e Fria e Ar: D
  Captação, Tratamento e Distribuição de Água: E
  Construção: F
  Comércio por Grosso e Retalho: G
  Transportes e Armazenagem: H
  Alojamento e Restauração: I
  Atividades de Informação e Comunicação: J
  Atividades Financeiras e de Seguros: K
  Atividades Imobiliárias: L
  Atividades de Consultadoria: M
  Atividades Administrativas e dos Serviços de Apoio: N
  Educação: P
  Atividades de Saúde Humana e de Apoio Social: Q
  Atividades Artísticas, De Espetáculos, Desportivas e Recreativas: R
  Outras Atividades de Serviços: S
